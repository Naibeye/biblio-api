logging.level.sn.ucad=DEBUG
# 1 jour : pour tester les retards sans attendre deux semaines
biblio.emprunt.etudiant.duree-jours=1

spring.datasource.url=jdbc:h2:mem:biblio
spring.h2.console.enabled=true
# Afficher le SQL généré : précieux pour comprendre
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Créer les tables à partir des entités (développement seulement)
spring.jpa.hibernate.ddl-auto=create-drop
