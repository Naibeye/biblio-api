logging.level.sn.ucad=DEBUG
spring.datasource.url=jdbc:h2:mem:biblio
spring.h2.console.enabled=true
# Afficher le SQL généré : précieux pour comprendre
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Créer les tables à partir des entités (développement seulement)
spring.jpa.hibernate.ddl-auto=create-drop
# Clé de repli pour le développement seulement ; en prod, JWT_SECRET est obligatoire
biblio.jwt.secret=${JWT_SECRET:cle-de-developpement-a-ne-jamais-utiliser-en-production}
