spring.datasource.url=jdbc:h2:mem:biblio
spring.h2.console.enabled=true
spring.jpa.show-sql=true
# Schéma + données de démonstration (réservées au développement)
spring.flyway.locations=classpath:db/migration,classpath:db/demo
logging.level.sn.ucad=DEBUG
# Clé de repli pour le développement seulement ; en prod, JWT_SECRET est obligatoire
biblio.jwt.secret=${JWT_SECRET:cle-de-developpement-a-ne-jamais-utiliser-en-production}
