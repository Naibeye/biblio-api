spring.application.name=biblio-api

# Exécuter data.sql APRÈS la création des tables par Hibernate (fichier lu en UTF-8)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Règles d'emprunt par catégorie
biblio.emprunt.etudiant.duree-jours=14
biblio.emprunt.etudiant.max-emprunts=3
biblio.emprunt.etudiant.penalite-par-jour=500
biblio.emprunt.enseignant.duree-jours=28
biblio.emprunt.enseignant.max-emprunts=5
biblio.emprunt.enseignant.penalite-par-jour=0

# TODO ch09 : fermer la session JPA à la fin du service, pas à la fin de la requête (open-in-view)
