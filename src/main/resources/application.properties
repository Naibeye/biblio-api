spring.application.name=biblio-api

# Pas de profil actif par défaut : on choisit dev ou prod au lancement.
# Le schéma est créé par Flyway ; Hibernate vérifie seulement qu'il correspond.
spring.jpa.hibernate.ddl-auto=validate
# Fermer la session JPA à la fin du service, pas à la fin de la requête
spring.jpa.open-in-view=false

# Règles d'emprunt par catégorie
biblio.emprunt.etudiant.duree-jours=14
biblio.emprunt.etudiant.max-emprunts=3
biblio.emprunt.etudiant.penalite-par-jour=500
biblio.emprunt.enseignant.duree-jours=28
biblio.emprunt.enseignant.max-emprunts=5
biblio.emprunt.enseignant.penalite-par-jour=0

# Clé de signature des jetons : fournie par l'environnement
biblio.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.application.nom=BiblioAPI
info.application.version=1.0.0

logging.level.sn.ucad=INFO
